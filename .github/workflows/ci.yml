# Tests, puis images publiées sur le registre GitHub (ghcr.io/<propriétaire>/…), étiquetées « latest » et « sha-<8> ».
name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q -r app/requirements.txt pytest && python -m pytest -q tests
  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Connexion au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construire et pousser
        run: |
          R=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=sha-${GITHUB_SHA::8}
          build() {   # build <image> <dockerfile> [arguments de build…]
            img=$R/$1; shift; file=$1; shift
            docker build -q --build-arg GIT_SHA=${GITHUB_SHA::8} -f "$file" "$@" -t "$img:latest" -t "$img:$SHA" .
            docker push -q "$img:latest"; docker push -q "$img:$SHA"
          }
          build fabrique Dockerfile
          build fabrique-runner Dockerfile.runner
          build fabrique-proxy Dockerfile.proxy
          build fabrique-job-python Dockerfile.job --build-arg BASE=python:3.12-slim-bookworm --build-arg FLAVOR=python
          build fabrique-job-node Dockerfile.job --build-arg BASE=node:22-bookworm-slim --build-arg FLAVOR=node
          build fabrique-job-go Dockerfile.job --build-arg BASE=golang:bookworm --build-arg FLAVOR=go
          build fabrique-job-java Dockerfile.job --build-arg BASE=eclipse-temurin:21-jdk-noble --build-arg FLAVOR=java --build-arg EXTRA=maven
