name: ci
on:
  push:
    branches: [main, k8s]
    tags: ["v*"]
jobs:
  test-build-push:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-venv >/dev/null
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q -r app/requirements.txt
          /tmp/v/bin/python -m pytest -q tests
      - name: Docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.1.5.tgz | tar -xz -C /tmp && install /tmp/docker/docker /usr/local/bin/docker
      - name: Build & push
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY }}                 # image registry host, e.g., registry.example.org
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}   # image namespace, e.g. team
        run: |
          [ -n "$REGISTRY" ] && [ -n "$IMAGE_NAMESPACE" ] || { echo "set the REGISTRY and IMAGE_NAMESPACE variables on the repository"; exit 1; }
          R=$REGISTRY/$IMAGE_NAMESPACE
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          TAG=${GITHUB_REF_NAME}; [ "$TAG" = "main" ] && TAG=latest
          # Images from a working branch: tagged with its name (k8s, k8s-<sha>), never "latest" or prod "sha-..."
          SHA=sha-${GITHUB_SHA::8}; [ "$TAG" = "latest" ] || case "$TAG" in v*) ;; *) SHA=$TAG-${GITHUB_SHA::8};; esac
          docker build --build-arg GIT_SHA=${GITHUB_SHA::8} -t $R/fabrique:$TAG -t $R/fabrique:$SHA .
          docker push $R/fabrique:$TAG
          docker push $R/fabrique:$SHA
          docker build --build-arg GIT_SHA=${GITHUB_SHA::8} -f Dockerfile.runner -t $R/fabrique-runner:$TAG -t $R/fabrique-runner:$SHA .
          docker push $R/fabrique-runner:$TAG
          docker push $R/fabrique-runner:$SHA
          # Job images: tagged by the fingerprint of what composes them; rebuilt only if it changes.
          JOBTAG=job-$(cat Dockerfile.job runner/fab.py runner/guard.py runner/security_check.py runner/managed-settings.json | sha256sum | cut -c1-10)
          for spec in "python python:3.12-slim-bookworm" "node node:22-bookworm-slim" "go golang:bookworm" "java eclipse-temurin:21-jdk-noble maven"; do
            set -- $spec; IMG=$R/fabrique-job-$1:$JOBTAG
            if docker manifest inspect "$IMG" >/dev/null 2>&1; then echo "$IMG already built"; docker pull -q "$IMG"; else
              docker build -f Dockerfile.job --build-arg BASE=$2 --build-arg FLAVOR=$1 --build-arg EXTRA="${3:-}" -t "$IMG" .
              docker push "$IMG"
            fi
            # Same tag as the other images (a single variable in compose.yaml): simple alias, nothing is rebuilt.
            for T in $TAG $SHA; do docker tag "$IMG" $R/fabrique-job-$1:$T; docker push -q $R/fabrique-job-$1:$T; done
          done
          echo "Job images: $JOBTAG"
          # Trace of Codex options in the CI log (check of the adapter, nothing else is executed)
          docker run --rm $R/fabrique-job-python:$JOBTAG sh -c 'codex --version; codex exec --help; codex exec resume --help' 2>&1 | head -150 || true
          docker build -f Dockerfile.proxy -t $R/fabrique-proxy:$TAG -t $R/fabrique-proxy:$SHA .
          docker push $R/fabrique-proxy:$TAG
          docker push $R/fabrique-proxy:$SHA
