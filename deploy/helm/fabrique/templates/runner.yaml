{{- if .Values.runner.enabled }}
{{- $name := include "fabrique.fullname" . }}
{{- $k8s := eq .Values.runner.executor "kubernetes" }}
{{- if not (has .Values.runner.executor (list "kubernetes" "local")) }}{{ fail "runner.executor: \"kubernetes\" or \"local\"" }}{{ end }}
{{- if not .Values.runner.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-work
  labels: {{- include "fabrique.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.runner.persistence.accessMode }}]
  {{- with .Values.runner.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.runner.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-runner
  labels: {{- include "fabrique.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "fabrique.selector" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels: {{- include "fabrique.labels" . | nindent 8 }}
        app.kubernetes.io/component: runner
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        {{- if $k8s }}
        # New work volume (NFS, CSI): the root often belongs to root. The runner's group is given to it at
        # mount, so that it can write to it; verified on the root only, not file by file.
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      containers:
        - name: runner
          image: {{ include "fabrique.image" (dict "root" . "name" "fabrique-runner") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: TZ, value: {{ .Values.timezone | quote }}}
            - {name: FABRIQUE_URL, value: "http://{{ $name }}:{{ .Values.service.port }}"}
            - name: FABRIQUE_RUNNER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "fabrique.secretName" . }}, key: runner-token}}
            - {name: RUNNER_HOST, value: {{ .Values.runner.name | quote }}}
            - {name: RUNNER_TAGS, value: {{ .Values.runner.tags | quote }}}
            - {name: CAPACITY, value: {{ .Values.runner.capacity | quote }}}
            {{- if $k8s }}
            # "docker" here refers to execution by a launcher, one container per job: on Kubernetes, one Pod per job.
            - {name: EXECUTOR, value: docker}
            - {name: LAUNCHER_URL, value: "http://{{ $name }}-launcher:7080"}
            - name: LAUNCHER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "fabrique.secretName" . }}, key: launcher-token}}
            - {name: RELAY_HOST, value: "0.0.0.0"}
            - {name: RELAY_PUBLIC_URL, value: "http://{{ $name }}-runner:7071"}
            - {name: GATEWAY_PUBLIC_URL, value: "http://{{ $name }}-runner:7072"}
            - {name: JOB_PROXY, value: "http://{{ $name }}-proxy:3128"}
            - {name: AGENT_UID, value: ""}       # no user change: the runner IS already the unprivileged user
            - {name: HOME, value: /tmp}
            {{- else }}
            - {name: EXECUTOR, value: local}
            {{- end }}
            - {name: GIT_AUTHOR, value: {{ .Values.runner.gitAuthor | quote }}}
            {{- include "fabrique.proxyEnv" . | nindent 12 }}
            {{- with .Values.runner.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          {{- if $k8s }}
          ports:
            - {name: relay, containerPort: 7071}
            - {name: gateway, containerPort: 7072}
          {{- end }}
          securityContext:
            {{- if $k8s }}
            # One Pod per job: no agent code runs here anymore. The runner is an unprivileged user, the same
            # as the one for the job Pods (10002), which is enough for it to prepare their work workspace in the shared
            # volume. Compliant with "restricted" Pod Security level.
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            {{- else }}
            # Jobs in this Pod: the runner starts as root without capabilities, except those used to launch the agent
            # under another user (10002, without rights or secrets) and stop it. Pod Security level "baseline".
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [SETUID, SETGID, KILL]}
            {{- end }}
          resources: {{- toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: {{ .Values.runner.persistence.existingClaim | default (printf "%s-work" $name) }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $k8s }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-runner
  labels: {{- include "fabrique.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  selector: {{- include "fabrique.selector" . | nindent 4 }}
    app.kubernetes.io/component: runner
  ports:                                 # reachable by job Pods only (NetworkPolicy)
    - {name: relay, port: 7071, targetPort: relay}
    - {name: gateway, port: 7072, targetPort: gateway}
{{- end }}
{{- end }}
