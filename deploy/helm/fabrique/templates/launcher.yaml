{{- if and .Values.runner.enabled (eq .Values.runner.executor "kubernetes") }}
{{- $name := include "fabrique.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-launcher
  labels: {{- include "fabrique.labels" . | nindent 4 }}
---
# Everything Fabrique can do in the cluster: manage Pods and execute commands in them, in THIS namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-launcher
  labels: {{- include "fabrique.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]            # proxy log reading: network egress of each job
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-launcher
  labels: {{- include "fabrique.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-launcher}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-launcher, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-launcher
  labels: {{- include "fabrique.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "fabrique.selector" . | nindent 6 }}
      app.kubernetes.io/component: launcher
  template:
    metadata:
      labels: {{- include "fabrique.labels" . | nindent 8 }}
        app.kubernetes.io/component: launcher
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $name }}-launcher      # The ONLY Fabrique Pod that has access to the cluster API
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: launcher
          image: {{ include "fabrique.image" (dict "root" . "name" "fabrique-runner") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, launcher.kube]
          ports:
            - {name: http, containerPort: 7080}
          env:
            - name: LAUNCHER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "fabrique.secretName" . }}, key: launcher-token}}
            - name: JOBS_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: JOBS_PREFIX, value: "{{ $name }}-job"}
            - {name: PROXY_SELECTOR, value: "app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=proxy"}
            - {name: WORK_PVC, value: {{ .Values.runner.persistence.existingClaim | default (printf "%s-work" $name) | quote }}}
            - name: JOB_IMAGES
              value: {{ $imgs := list }}{{ range $k, $v := .Values.jobs.images }}{{ $imgs = append $imgs (printf "%s=%s/%s:%s" $k $.Values.image.registry $v ($.Values.image.tag | toString)) }}{{ end }}{{ join "," $imgs | quote }}
            - {name: JOB_MEMORY, value: {{ .Values.jobs.memory | quote }}}
            - {name: JOB_CPUS, value: {{ .Values.jobs.cpu | quote }}}
            - {name: JOB_START_TIMEOUT, value: {{ .Values.jobs.startTimeoutSeconds | quote }}}
            - {name: JOB_IMAGE_PULL_POLICY, value: {{ .Values.image.pullPolicy | quote }}}
            - {name: JOB_IMAGE_PULL_SECRETS, value: {{ $ps := list }}{{ range .Values.imagePullSecrets }}{{ $ps = append $ps .name }}{{ end }}{{ join "," $ps | quote }}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.launcher.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-launcher
  labels: {{- include "fabrique.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
spec:
  selector: {{- include "fabrique.selector" . | nindent 4 }}
    app.kubernetes.io/component: launcher
  ports:
    - {name: http, port: 7080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-proxy
  labels: {{- include "fabrique.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "fabrique.selector" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels: {{- include "fabrique.labels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # The proxy only resolves fully qualified public names: without this, the resolver first tries search domains
      # of the cluster and the node (pypi.org.<domaine>...), and an empty response on one of them causes resolution to fail.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: {{ include "fabrique.image" (dict "root" . "name" "fabrique-proxy") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: proxy, containerPort: 3128}
          env:
            - {name: PROXY_ALLOW, value: {{ join "," .Values.proxy.allow | quote }}}
            {{- if .Values.outboundProxy.url }}
            - {name: PROXY_UPSTREAM, value: {{ .Values.outboundProxy.url | quote }}}
            - {name: PROXY_NO_UPSTREAM, value: {{ .Values.outboundProxy.noProxy | quote }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-proxy
  labels: {{- include "fabrique.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  selector: {{- include "fabrique.selector" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - {name: proxy, port: 3128, targetPort: proxy}
{{- if .Values.networkPolicy.enabled }}
---
# A job Pod receives nothing and only joins three things: the egress proxy (allowlist), the relay and the gateway
# of the runner, and the cluster DNS. Not the Kubernetes API, not the dashboard, not direct Internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-jobs
  labels: {{- include "fabrique.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {fabrique.io/role: job}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "fabrique.selector" . | nindent 14 }}
              app.kubernetes.io/component: proxy
      ports:
        - {protocol: TCP, port: 3128}
    - to:
        - podSelector:
            matchLabels: {{- include "fabrique.selector" . | nindent 14 }}
              app.kubernetes.io/component: runner
      ports:
        - {protocol: TCP, port: 7071}
        - {protocol: TCP, port: 7072}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# The launcher can only be reached by the runner.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-launcher
  labels: {{- include "fabrique.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "fabrique.selector" . | nindent 6 }}
      app.kubernetes.io/component: launcher
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "fabrique.selector" . | nindent 14 }}
              app.kubernetes.io/component: runner
      ports:
        - {protocol: TCP, port: 7080}
{{- end }}
{{- end }}
