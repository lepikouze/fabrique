{{- if not .Values.secrets.existingSecret }}
{{- /* Generated once, then read back from the cluster on every upgrade: changing these values would close the sessions,
       make the stored keys unreadable and cut off the built-in runner. */ -}}
{{- $name := include "fabrique.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "fabrique.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep        # never deleted by `helm uninstall`: without it, data is unreadable
type: Opaque
data:
  session-secret: {{ index $old "session-secret" | default (randAlphaNum 64 | b64enc) }}
  secret-key: {{ index $old "secret-key" | default (randAlphaNum 64 | b64enc) }}
  runner-token: {{ index $old "runner-token" | default (printf "fab_%s" (randAlphaNum 48) | b64enc) }}
  launcher-token: {{ index $old "launcher-token" | default (randAlphaNum 64 | b64enc) }}
{{- end }}
