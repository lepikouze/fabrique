# Fabrique — a runner, on a different machine than the dashboard. Three services, each with a single power:
#   runner   : receives orders from the dashboard, runs the jobs; NO Docker access
#   launcher : only Docker access; creates disposable job containers, with a fixed policy
#   proxy    : only network egress of the jobs, allowlisted
#
# Two values to provide, nothing else:
#   FABRIQUE_URL           the dashboard address, as this machine sees it (e.g. https://fabrique.example.org)
#   FABRIQUE_RUNNER_TOKEN  the token displayed once by the dashboard: Runners → New runner
#
#   FABRIQUE_URL=https://fabrique.example.org FABRIQUE_RUNNER_TOKEN=fab_… docker compose -f runner.compose.example.yaml up -d
#
# The runner appears "online" in the dashboard in a few seconds. Git tokens and model keys are configured
# in the dashboard (Settings): nothing to put here. Images: same variables as the compose.yaml (see .env.example).
name: ${COMPOSE_PROJECT_NAME:-fabrique-runner}

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

networks:
  launcher:                      # runner <-> launcher, nothing else
  jobs:                          # jobs <-> proxy, relay and gateway of the runner; no direct egress
    name: ${COMPOSE_PROJECT_NAME:-fabrique-runner}-jobs
    internal: true

volumes:
  launcher-token:                 # shared token runner <-> launcher, created by the launcher: nothing to generate

services:
  runner:
    <<: *hardened
    image: ${FABRIQUE_IMAGES:-fabrique-local}/fabrique-runner:${FABRIQUE_TAG:-latest}
    depends_on: [launcher, proxy]
    tmpfs: [/tmp]
    mem_limit: 1g
    cap_add: [SETUID, SETGID, KILL]            # change user for operations in the workspace
    environment:
      TZ: ${TZ:-Europe/Paris}
      FABRIQUE_URL: ${FABRIQUE_URL:?give the dashboard's address (FABRIQUE_URL)}
      FABRIQUE_RUNNER_TOKEN: ${FABRIQUE_RUNNER_TOKEN:?give the runner's token (Runners → New runner)}
      RUNNER_HOST: ${RUNNER_HOST:-runner-1}
      RUNNER_TAGS: ${RUNNER_TAGS:-docker}
      CAPACITY: ${CAPACITY:-2}
      EXECUTOR: docker
      LAUNCHER_URL: http://launcher:7080
      LAUNCHER_TOKEN_FILE: /launcher-token/token
      RELAY_HOST: 0.0.0.0
      RELAY_PUBLIC_URL: http://runner:7071
      GATEWAY_PUBLIC_URL: http://runner:7072
      JOB_PROXY: http://proxy:3128
      GIT_AUTHOR: ${GIT_AUTHOR:-Agent Fabrique <fabrique-bot@noreply.invalid>}
    volumes:
      - ${FABRIQUE_WORK_DIR:-/opt/fabrique/work}:/work
      - launcher-token:/launcher-token:ro
    networks: [launcher, jobs, default]

  launcher:
    <<: *hardened
    image: ${FABRIQUE_IMAGES:-fabrique-local}/fabrique-runner:${FABRIQUE_TAG:-latest}
    command: ["python", "-m", "launcher.main"]
    mem_limit: 256m
    environment:
      LAUNCHER_TOKEN_FILE: /launcher-token/token
      # Allowlist of job images: the runner only selects one NAME from this list.
      JOB_IMAGES: python=${FABRIQUE_IMAGES:-fabrique-local}/fabrique-job-python:${FABRIQUE_TAG:-latest},node=${FABRIQUE_IMAGES:-fabrique-local}/fabrique-job-node:${FABRIQUE_TAG:-latest},go=${FABRIQUE_IMAGES:-fabrique-local}/fabrique-job-go:${FABRIQUE_TAG:-latest},java=${FABRIQUE_IMAGES:-fabrique-local}/fabrique-job-java:${FABRIQUE_TAG:-latest}
      JOBS_NETWORK: ${COMPOSE_PROJECT_NAME:-fabrique-runner}-jobs
      JOBS_PREFIX: ${COMPOSE_PROJECT_NAME:-fabrique-runner}-job
      WORK_HOST: ${FABRIQUE_WORK_DIR:-/opt/fabrique/work}     # the same folder as /work of the runner, as seen from the host
      JOB_MEMORY: ${JOB_MEMORY:-4g}
      JOB_CPUS: ${JOB_CPUS:-2}
      JOB_PIDS: ${JOB_PIDS:-512}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock                # ONLY component with Docker access
      - launcher-token:/launcher-token
    networks: [launcher]

  proxy:
    <<: *hardened
    image: ${FABRIQUE_IMAGES:-fabrique-local}/fabrique-proxy:${FABRIQUE_TAG:-latest}
    tmpfs: [/tmp]
    mem_limit: 128m
    environment:
      # Hostnames reachable by jobs (anchored regular expressions). Nothing else goes out.
      PROXY_ALLOW: ${PROXY_ALLOW:-^pypi\.org$$,^files\.pythonhosted\.org$$,^registry\.npmjs\.org$$,^proxy\.golang\.org$$,^sum\.golang\.org$$,^repo\.maven\.apache\.org$$,^repo1\.maven\.org$$,^services\.gradle\.org$$,^downloads\.gradle\.org$$,^plugins\.gradle\.org$$,^plugins-artifacts\.gradle\.org$$}
      # Behind an enterprise proxy: authorized requests are sent to it (see docs/configuration.md).
      PROXY_UPSTREAM: ${PROXY_UPSTREAM:-}
      PROXY_NO_UPSTREAM: ${PROXY_NO_UPSTREAM:-}
    networks: [jobs, default]
