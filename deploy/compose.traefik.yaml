# Fabrique — pile complète derrière Traefik : dashboard, runner intégré, launcher, proxy de sortie.
# Images publiées (ghcr.io/lepikouze, étiquette « latest ») : rien à cloner ni à construire.
#
#   Dans un fichier .env à côté de ce fichier :
#     FABRIQUE_HOST=fabrique.exemple.org      nom de domaine du dashboard (obligatoire)
#     TRAEFIK_NETWORK=traefik                 réseau Docker de ton Traefik (défaut : traefik)
#     TRAEFIK_CERTRESOLVER=letsencrypt        résolveur de certificats de ton Traefik (défaut : letsencrypt)
#     TRAEFIK_ENTRYPOINT=websecure            point d'entrée https de ton Traefik (défaut : websecure)
#   docker compose -f compose.traefik.yaml up -d
#   docker compose -f compose.traefik.yaml logs dashboard | grep "code d'installation"
#   puis ouvrir https://<FABRIQUE_HOST>, saisir le code et créer le compte administrateur.
#
# Aucune variable n'est obligatoire hormis FABRIQUE_HOST. Recommandé en production, dans un fichier .env à côté de ce fichier :
#   SESSION_SECRET=…          openssl rand -hex 32     (signe les sessions)
#   FABRIQUE_SECRET_KEY=…     openssl rand -hex 32     (chiffre les clés des modèles et les tokens Git ; à ne jamais perdre)
#   FABRIQUE_TAG=…            une version précise plutôt que « latest »
# Tout le reste (connexion unique, repos Git, modèles, notifications) se règle dans le dashboard.
name: ${COMPOSE_PROJECT_NAME:-fabrique}

x-images:
  dashboard: &img-dashboard ${FABRIQUE_IMAGES:-ghcr.io/lepikouze}/fabrique:${FABRIQUE_TAG:-latest}
  runner: &img-runner ${FABRIQUE_IMAGES:-ghcr.io/lepikouze}/fabrique-runner:${FABRIQUE_TAG:-latest}
  proxy: &img-proxy ${FABRIQUE_IMAGES:-ghcr.io/lepikouze}/fabrique-proxy:${FABRIQUE_TAG:-latest}
x-durci: &durci
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

networks:
  traefik:                       # le réseau Docker de ton Traefik, déjà existant
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
  interne:                       # dashboard <-> runner
  launcher:                      # runner <-> launcher, rien d'autre
  jobs:                          # jobs <-> proxy, relay et gateway du runner ; aucune sortie directe
    name: ${COMPOSE_PROJECT_NAME:-fabrique}-jobs
    internal: true

volumes:
  donnees:                       # base et secrets générés du dashboard
  amorce:                        # token du runner intégré, déposé par le dashboard
  jeton-lanceur:                 # token partagé runner <-> launcher, créé par le launcher

services:
  dashboard:
    <<: *durci
    image: *img-dashboard
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      TZ: ${TZ:-Europe/Paris}
      PUBLIC_URL: ${PUBLIC_URL:-https://${FABRIQUE_HOST}}
      FABRIQUE_BOOTSTRAP_RUNNER_FILE: /bootstrap/jeton-runner
      # Recommandé en production : fournis ces deux secrets (fichier .env) pour qu'ils restent séparés des données.
      # Sans eux, ils sont générés au premier démarrage et gardés dans le volume des données. Générer : openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:-}
      FABRIQUE_SECRET_KEY: ${FABRIQUE_SECRET_KEY:-}
      # Facultatif — la connexion unique se règle aussi dans le dashboard (Settings → Connexion).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      FABRIQUE_ADMINS: ${FABRIQUE_ADMINS:-}
      FABRIQUE_DEMO: ${FABRIQUE_DEMO:-0}
    volumes:
      - donnees:/data
      - amorce:/bootstrap
    labels:                                    # aucun port publié : seul Traefik atteint le dashboard
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.fabrique.rule: Host(`${FABRIQUE_HOST:?nom de domaine du dashboard, ex. fabrique.exemple.org}`)
      traefik.http.routers.fabrique.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fabrique.tls: "true"
      traefik.http.routers.fabrique.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.fabrique.service: fabrique
      traefik.http.services.fabrique.loadbalancer.server.port: "8080"
      # Pour ajouter tes middlewares (en-têtes, liste d'adresses…), décommente et adapte :
      # traefik.http.routers.fabrique.middlewares: mon-middleware@file
    networks: [interne, traefik]

  runner:
    <<: *durci
    image: *img-runner
    depends_on: [dashboard, launcher, proxy]
    tmpfs: [/tmp]
    mem_limit: 1g
    cap_add: [SETUID, SETGID, KILL]            # changer d'utilisateur pour les opérations dans l'workspace
    group_add: ["10001"]                       # lire le token déposé par le dashboard (fichier 0640) ; l'agent n'a pas ce groupe
    environment:
      TZ: ${TZ:-Europe/Paris}
      FABRIQUE_URL: http://dashboard:8080
      FABRIQUE_RUNNER_TOKEN_FILE: /bootstrap/jeton-runner
      RUNNER_HOST: ${RUNNER_HOST:-runner-integre}
      RUNNER_TAGS: ${RUNNER_TAGS:-docker}
      CAPACITY: ${CAPACITY:-2}
      EXECUTOR: docker
      LAUNCHER_URL: http://launcher:7080
      LAUNCHER_TOKEN_FILE: /jeton-lanceur/jeton
      RELAY_HOST: 0.0.0.0
      RELAY_PUBLIC_URL: http://runner:7071
      GATEWAY_PUBLIC_URL: http://runner:7072
      JOB_PROXY: http://proxy:3128
      GIT_AUTHOR: ${GIT_AUTHOR:-Agent Fabrique <fabrique-bot@noreply.invalid>}
      # Facultatif — les tokens Git se règlent aussi dans le dashboard (Settings → Providers Git).
      GIT_BASE_URL: ${GIT_BASE_URL:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ${FABRIQUE_WORK_DIR:-/opt/fabrique/travail}:/work
      - amorce:/bootstrap:ro
      - jeton-lanceur:/jeton-lanceur:ro
    networks: [interne, launcher, jobs, default]

  launcher:
    <<: *durci
    image: *img-runner
    command: ["python", "-m", "lanceur.main"]
    mem_limit: 256m
    environment:
      LAUNCHER_TOKEN_FILE: /jeton-lanceur/jeton
      # Liste blanche des images de jobs : le runner ne choisit qu'un NOM de cette liste.
      ATELIER_IMAGES: python=${FABRIQUE_IMAGES:-ghcr.io/lepikouze}/fabrique-job-python:${FABRIQUE_TAG:-latest},node=${FABRIQUE_IMAGES:-ghcr.io/lepikouze}/fabrique-job-node:${FABRIQUE_TAG:-latest},go=${FABRIQUE_IMAGES:-ghcr.io/lepikouze}/fabrique-job-go:${FABRIQUE_TAG:-latest},java=${FABRIQUE_IMAGES:-ghcr.io/lepikouze}/fabrique-job-java:${FABRIQUE_TAG:-latest}
      JOBS_NETWORK: ${COMPOSE_PROJECT_NAME:-fabrique}-jobs
      JOBS_PREFIX: ${COMPOSE_PROJECT_NAME:-fabrique}-job
      WORK_HOST: ${FABRIQUE_WORK_DIR:-/opt/fabrique/travail}     # le même dossier que /work du runner, vu de l'hôte
      JOB_MEMORY: ${JOB_MEMORY:-4g}
      JOB_CPUS: ${JOB_CPUS:-2}
      JOB_PIDS: ${JOB_PIDS:-512}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock                # SEUL composant avec l'accès Docker
      - jeton-lanceur:/jeton-lanceur
    networks: [launcher]

  proxy:
    <<: *durci
    image: *img-proxy
    tmpfs: [/tmp]
    mem_limit: 128m
    environment:
      # Noms d'hôtes joignables par les jobs (expressions régulières ancrées). Rien d'autre ne sort.
      PROXY_ALLOW: ${PROXY_ALLOW:-^pypi\.org$$,^files\.pythonhosted\.org$$,^registry\.npmjs\.org$$,^proxy\.golang\.org$$,^sum\.golang\.org$$,^repo\.maven\.apache\.org$$,^repo1\.maven\.org$$,^services\.gradle\.org$$,^downloads\.gradle\.org$$,^plugins\.gradle\.org$$,^plugins-artifacts\.gradle\.org$$}
      # Derrière un proxy d'entreprise : les requêtes autorisées lui sont envoyées (voir docs/configuration.md).
      PROXY_UPSTREAM: ${PROXY_UPSTREAM:-}
      PROXY_NO_UPSTREAM: ${PROXY_NO_UPSTREAM:-}
    networks: [jobs, default]
