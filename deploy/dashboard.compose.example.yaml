# Fabrique — the dashboard only, when runners run on other machines.
# (Everything on a single machine? Use the compose.yaml at the root instead: it already contains a runner.)
#
#   docker compose -f dashboard.compose.example.yaml up -d
#   docker compose -f dashboard.compose.example.yaml logs dashboard | grep "setup code"
#
# No variable is mandatory. Open the dashboard, enter the setup code, create the administrator account:
# everything else (single sign-on, models, Git repos, runners) is configured in the dashboard.
# Images: the same variables as compose.yaml (FABRIQUE_IMAGES, FABRIQUE_TAG), see .env.example.
name: ${COMPOSE_PROJECT_NAME:-fabrique-dashboard}

volumes:
  data:                       # database and generated secrets

services:
  dashboard:
    image: ${FABRIQUE_IMAGES:-fabrique-local}/fabrique:${FABRIQUE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Address at which browsers AND runners reach the dashboard.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # The runners are on other machines: they arrive via the network (or via your reverse proxy), with their token.
      FABRIQUE_RUNNER_API_INTERNAL: "0"
      # Optional — recommended in production: provide these secrets so they remain separate from the data.
      SESSION_SECRET: ${SESSION_SECRET:-}
      FABRIQUE_SECRET_KEY: ${FABRIQUE_SECRET_KEY:-}
    volumes:
      - data:/data
    ports: ["${FABRIQUE_PORT:-8080}:8080"]     # in production: behind a TLS reverse proxy
