# Fabrique — le dashboard seul, quand les runners tournent sur d'autres machines.
# (Tout sur une seule machine ? Utilise plutôt le compose.yaml à la racine : il contient déjà un runner.)
#
#   docker compose -f dashboard.compose.example.yaml up -d
#   docker compose -f dashboard.compose.example.yaml logs dashboard | grep "code d'installation"
#
# Aucune variable n'est obligatoire. Ouvre le dashboard, saisis le code d'installation, crée le compte administrateur :
# tout le reste (connexion unique, modèles, repos Git, runners) se règle dans l'interface.
# Images : les mêmes variables que le compose.yaml (FABRIQUE_IMAGES, FABRIQUE_TAG), voir .env.example.
name: ${COMPOSE_PROJECT_NAME:-fabrique-dashboard}

volumes:
  donnees:                       # base et secrets générés

services:
  dashboard:
    image: ${FABRIQUE_IMAGES:-fabrique-local}/fabrique:${FABRIQUE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Adresse à laquelle les navigateurs ET les runners joignent le dashboard.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Les runners sont sur d'autres machines : ils arrivent par le réseau (ou par ton proxy inverse), avec leur token.
      FABRIQUE_RUNNER_API_INTERNAL: "0"
      # Facultatif — recommandé en production : fournis ces secrets pour qu'ils restent séparés des données.
      SESSION_SECRET: ${SESSION_SECRET:-}
      FABRIQUE_SECRET_KEY: ${FABRIQUE_SECRET_KEY:-}
    volumes:
      - donnees:/data
    ports: ["${FABRIQUE_PORT:-8080}:8080"]     # en production : derrière un proxy inverse TLS
